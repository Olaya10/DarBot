# Nombre de la aplicación
spring.application.name=darbot

# Configuración de conexión a PostgreSQL
# Por defecto usa localhost para desarrollo local; en Docker o Kubernetes se puede sobrescribir con variables de entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/darbot_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:darbot_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:darbot123}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.issuer=DarBot