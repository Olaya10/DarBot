<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso institucional - I.E. Dario Torregroza Pérez</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin/admin.css">
</head>
<body>
  <header class="py-3 mb-4 border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="d-flex align-items-center text-dark text-decoration-none"><img src="imagenes/Logo IEDTP.jpeg" alt="logo" style="height:44px;margin-right:10px;"><strong>I.E. Dario Torregroza Pérez</strong></a>
      <nav><a href="/">Volver al sitio</a></nav>
    </div>
  </header>

  <main class="container py-5">
    <div class="mx-auto" style="max-width:460px;">
      <div class="card p-4">
        <h2 class="h4 mb-3">Acceso institucional</h2>
        <p class="text-muted">Accede al panel administrativo con tus credenciales institucionales.</p>
        <form id="instLoginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input id="username" name="username" class="form-control" required autocomplete="username">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password">
          </div>
          <div id="loginError" class="text-danger mb-2" role="status" aria-live="polite"></div>
          <button class="btn btn-danger w-100" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer-ie mt-5 py-4">
    <div class="container text-center">
      &copy; <span id="anioActualFooter"></span> I.E. Dario Torregroza Pérez
    </div>
  </footer>

  <script>
  (function(){
    const form = document.getElementById('instLoginForm');
    const err = document.getElementById('loginError');
    function setToken(t){ if(t) localStorage.setItem('darbot_token', t); else localStorage.removeItem('darbot_token'); }
    form.addEventListener('submit', async (e)=>{
      e.preventDefault(); err.textContent='';
      const username = form.username.value.trim(); const password = form.password.value;
      if(!username || !password){ err.textContent = 'Usuario y contraseña son requeridos'; return; }
      try{
        const API_BASE = (location.port && location.port !== '8080') ? (location.protocol + '//' + location.hostname + ':8080') : '';
        const res = await fetch(API_BASE + '/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
        if(!res.ok){ const tx = await res.text().catch(()=>null); err.textContent = 'Credenciales inválidas'; return; }
        const data = await res.json(); if(data.token){ setToken(data.token); window.location.href = '/admin/index.html'; } else { err.textContent = 'Respuesta inválida del servidor'; }
      }catch(errx){ console.error(errx); err.textContent = 'Error de conexión'; }
    });
  })();
  </script>
</body>
</html>
