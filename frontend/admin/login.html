<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | DarBot</title>
  
  <link rel="icon" href="../imagenes/Logo IEDTP.jpeg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">

  <style>
    .login-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, rgba(32, 10, 14, 0.92), rgba(140, 11, 32, 0.95)), url('../imagenes/imagen estudiantes.jpg') center/cover no-repeat fixed;
      color: #fff;
    }

    .login-navbar {
      padding: 16px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.98);
      color: var(--carbon);
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--rojo-ie), var(--rojo-ie-oscuro));
    }

    .login-brand-logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid var(--rojo-ie);
      padding: 3px;
      background: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 8px 20px rgba(200, 16, 46, 0.2);
    }

    .input-icon-group {
      position: relative;
    }

    .input-icon-group .form-control {
      padding-left: 44px;
      padding-right: 44px;
      height: 50px;
      border-radius: 12px;
      border: 1px solid rgba(32, 26, 26, 0.15);
      font-size: 0.95rem;
    }

    .input-icon-group .form-control:focus {
      border-color: var(--rojo-ie);
      box-shadow: 0 0 0 4px rgba(200, 16, 46, 0.12);
    }

    .input-icon-group .input-icon-left {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--rojo-ie);
      font-size: 1.1rem;
      pointer-events: none;
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--gris-texto);
      padding: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    .toggle-password-btn:hover {
      color: var(--rojo-ie);
    }

    .btn-login-submit {
      height: 50px;
      border-radius: 999px;
      background: var(--rojo-ie);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 8px 20px rgba(200, 16, 46, 0.3);
    }

    .btn-login-submit:hover {
      background: var(--rojo-ie-oscuro);
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="login-body">

  <header class="login-navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="../index.html" class="d-flex align-items-center text-white text-decoration-none gap-2">
        <img src="../imagenes/Logo IEDTP.jpeg" alt="Logo IEDTP" style="width:42px;height:42px;border-radius:50%;border:2px solid #fff;">
        <span class="fw-bold">I.E. Darío Torregroza Pérez</span>
      </a>
      <a href="../index.html" class="text-white text-decoration-none fw-semibold small">
        <i class="fa-solid fa-arrow-left me-1"></i> Volver al sitio web
      </a>
    </div>
  </header>

  <main class="login-container">
    <div class="login-card">
      <div class="text-center mb-4">
        <img src="../imagenes/Logo IEDTP.jpeg" alt="Escudo Institucional" class="login-brand-logo">
        <h1 class="h4 fw-bold mb-1">Panel Administrativo</h1>
        <p class="text-secondary small mb-0">Ingresa tus credenciales para administrar la plataforma</p>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold small text-dark">Usuario</label>
          <div class="input-icon-group">
            <i class="fa-solid fa-user input-icon-left"></i>
            <input id="username" name="username" class="form-control" placeholder="Ej: admin" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold small text-dark">Contraseña</label>
          <div class="input-icon-group">
            <i class="fa-solid fa-lock input-icon-left"></i>
            <input id="password" name="password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Mostrar u ocultar contraseña">
              <i class="fa-solid fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div id="loginError" class="alert alert-danger d-none py-2 px-3 small text-center mb-3" role="alert"></div>

        <button class="btn btn-login-submit w-100 d-flex align-items-center justify-content-center" type="submit" id="btnSubmit">
          <span>Iniciar Sesión</span>
        </button>
      </form>
    </div>
  </main>

  <!-- Configuración de Backend -->
  <script>
    if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      window.DARBOT_BACKEND_URL = 'https://darbot-backend.onrender.com';
    }
  </script>
  <script src="../config.js"></script>
  <script src="admin.js" type="module"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      if (togglePasswordBtn && passwordInput && toggleIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });
      }
    });
  </script>
</body>
</html>
