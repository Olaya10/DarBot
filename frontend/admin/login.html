<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - DarBot</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
 </head>
<body class="admin-login-page">
  <main class="container py-5">
    <div class="admin-login card mx-auto p-4" style="max-width:420px;">
      <h2 class="h4 mb-3">Panel administrativo</h2>
      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" name="password" type="password" class="form-control" required>
        </div>
        <div id="loginError" class="text-danger mb-2 d-none"></div>
        <button class="btn btn-danger w-100" type="submit">Entrar</button>
      </form>
    </div>
  </main>
  <script src="/admin/admin.js" type="module"></script>
</body>
</html>
